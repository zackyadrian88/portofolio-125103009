<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zacky Adrian | Kontak</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts: Libre Baskerville (judul) & Inter (teks) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS kustom (harus setelah Bootstrap) -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="header">
        <div class="profile">
            <img class="avatar" src="assets/profile.jpg" alt="Foto profil Zacky Adrian">
            <p class="site-name">Zacky Adrian</p>
            <div class="social-links">
                <a href="https://github.com/zackyadrian88" target="_blank" rel="noopener" aria-label="GitHub">gh</a>
                <a href="https://www.linkedin.com/in/zacky-adrian-84123a29b/" target="_blank" rel="noopener"
                    aria-label="LinkedIn">in</a>
            </div>
        </div>

        <nav class="nav-menu" aria-label="Navigasi utama">
            <ul class="nav justify-content-center flex-lg-column">
                <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                <li class="nav-item"><a class="nav-link" href="portfolio.html">Proyek</a></li>
                <li class="nav-item"><a class="nav-link active" href="contact.html" aria-current="page">Kontak</a></li>
            </ul>
        </nav>
    </header>

    <main id="main">
        <div class="content">

            <section id="kontak" aria-labelledby="judul-kontak">
                <h1 id="judul-kontak" class="mb-4">Kontak</h1>

                <div class="row g-4">

                    <div class="col-12">
                        <article class="card">
                            <div class="card-body">
                                <h3>Informasi Kontak</h3>
                                <ul class="list-unstyled mb-0">
                                    <li class="mb-2"><strong>GitHub:</strong>
                                        <a href="https://github.com/zackyadrian88" target="_blank"
                                            rel="noopener">zackyadrian88</a></li>
                                    <li class="mb-2"><strong>LinkedIn:</strong>
                                        <a href="https://www.linkedin.com/in/zacky-adrian-84123a29b/" target="_blank"
                                            rel="noopener">Zacky Adrian</a></li>
                                    <li><strong>Status:</strong> Tersedia untuk proyek terpilih</li>
                                </ul>
                            </div>
                        </article>
                    </div>

                    <div class="col-12">
                        <article class="card">
                            <div class="card-body">
                                <h3>Kirim Pesan</h3>

                                <form action="#" method="POST">
                                    <div class="mb-3">
                                        <label for="nama" class="form-label">Nama Anda</label>
                                        <input type="text" id="nama" name="nama" class="form-control" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email Anda</label>
                                        <input type="email" id="email" name="email" class="form-control" required>
                                    </div>

                                    <div class="mb-4">
                                        <label for="pesan" class="form-label">Pesan</label>
                                        <textarea id="pesan" name="pesan" rows="5" class="form-control"
                                            required></textarea>
                                    </div>

                                    <button type="submit" class="btn btn-primary">Kirim Pesan</button>
                                </form>
                            </div>
                        </article>
                    </div>

                </div>
            </section>

        </div>
    </main>

    <footer class="site-footer">
        <p class="mb-0"></p>
    </footer>

</body>

</html>
